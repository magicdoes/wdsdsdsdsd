name: Build MagicSMP

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: guard/pom.xml

      - name: Install current MagicSMP JAR
        run: |
          mvn install:install-file \
            -Dfile=baseline/MagicSMP-current.jar \
            -DgroupId=com.bx \
            -DartifactId=magicsmp-current \
            -Dversion=1.0 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Build Sell GUI Fix
        working-directory: guard
        run: mvn -B clean package

      - name: Build Final MagicSMP JAR
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify Final JAR
        run: |
          test -f build/MagicSMP.jar
          echo "MagicSMP.jar built successfully"
          ls -lh build/MagicSMP.jar

      - name: Upload MagicSMP
        uses: actions/upload-artifact@v4
        with:
          name: MagicSMP
          path: build/MagicSMP.jar
          if-no-files-found: error
