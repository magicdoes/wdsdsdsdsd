name: Build MagicSMP

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: guard/pom.xml

      - name: Build MagicSMP
        working-directory: guard
        run: mvn -B clean package

      - name: Upload MagicSMP JAR
        uses: actions/upload-artifact@v4
        with:
          name: MagicSMP
          path: guard/target/*.jar
          if-no-files-found: error
